<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maurya Coin Toss</title>

<style>

body{
margin:0;
background:brown;]
font-family:Arial;
color:white;
text-align:center;
}

.top{
height:50vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.circle{
width:260px;
height:260px;
border-radius:50%;
border:3px solid red;
display:flex;
justify-content:center;
align-items:center;
perspective:1000px;
}

.coin{
width:140px;
height:140px;
position:relative;
transform-style:preserve-3d;
cursor:pointer;
transition:transform 1.2s ease-out;
}

.side{
position:absolute;
width:100%;
height:100%;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
backface-visibility:hidden;
}

.head{
background:gold;
color:black;
}

.tail{
background:pink;
color:black;
transform:rotateY(180deg);
}

.bottom{
padding:20px;
line-height:1.6;
}

/* confetti */

.confetti{
position:fixed;
width:10px;
height:10px;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

</style>
</head>

<body>

<div class="top">

<h1>🪙 Maurya Coin Toss✨</h1>

<h2><mark>Flip coin...👇✨</h2>
<div class="circle">

<div class="coin" id="coin">

<div class="side head">HEAD</div>
<div class="side tail">TAIL</div>

</div>

</div>

</div>

<div class="bottom">

<p>
Tap the coin to toss. The coin will flip fast and randomly land on HEAD or TAIL.
     <br><br>               ~By Maurya...
</p>

</div>

<audio id="sound">
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

let coin=document.getElementById("coin")
let sound=document.getElementById("sound")

let rotation=0

coin.addEventListener("click",function(){

// play sound
sound.currentTime=0
sound.play().catch(()=>{})

// random result
let result=Math.random()<0.5?0:1

// fast spins
let spins=(Math.floor(Math.random()*6)+8)*360

rotation+=spins+(result*180)

coin.style.transform="rotateY("+rotation+"deg) translateY(-80px)"

setTimeout(()=>{
coin.style.transform="rotateY("+rotation+"deg)"
confetti()
},600)

})

function confetti(){

for(let i=0;i<40;i++){

let el=document.createElement("div")

el.className="confetti"

el.style.left=Math.random()*100+"vw"
el.style.background="hsl("+Math.random()*360+"deg,100%,50%)"
el.style.animationDuration=(Math.random()*2+2)+"s"

document.body.appendChild(el)

setTimeout(()=>el.remove(),4000)

}

}

</script>

</body>
</html>
